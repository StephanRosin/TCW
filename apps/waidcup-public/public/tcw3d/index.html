<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Tennisclub — Rundgang</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87b7e8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* Fadenkreuz */
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.85); box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
      pointer-events: none; opacity: 0; transition: opacity .2s;
    }
    body.locked #crosshair { opacity: 1; }

    /* HUD */
    #hud {
      position: fixed; left: 14px; bottom: 12px; color: #fff;
      font-size: 12px; line-height: 1.5; text-shadow: 0 1px 3px rgba(0,0,0,.6);
      opacity: 0; transition: opacity .3s; pointer-events: none;
    }
    body.locked #hud { opacity: .9; }
    #hud b { color: #ffe08a; }

    /* Start-Overlay */
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(1200px 600px at 50% 30%, rgba(20,40,70,.55), rgba(8,16,28,.85));
      backdrop-filter: blur(2px); z-index: 10; transition: opacity .4s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .card {
      max-width: 460px; width: calc(100% - 40px);
      background: rgba(16,26,40,.75); border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px; padding: 30px 32px; text-align: center; color: #eaf1fb;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
    }
    .card h1 { font-size: 22px; letter-spacing: .3px; margin-bottom: 6px; }
    .card .sub { font-size: 13px; color: #9db4d4; margin-bottom: 22px; }
    .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; text-align: left; font-size: 13px; margin: 0 auto 24px; max-width: 300px; }
    .keys .k { display: inline-block; min-width: 24px; padding: 2px 8px; text-align: center;
      background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
      border-radius: 6px; font-family: ui-monospace, monospace; font-size: 12px; }
    .keys .d { color: #b9c9e2; align-self: center; }
    #play {
      appearance: none; border: none; cursor: pointer;
      background: linear-gradient(180deg, #4da3ff, #2c7de0); color: #fff;
      font-size: 15px; font-weight: 600; padding: 13px 30px; border-radius: 12px;
      box-shadow: 0 8px 22px rgba(44,125,224,.45);
    }
    #play:hover { filter: brightness(1.06); }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #eaf1fb; font-size: 14px; z-index: 20; background: #0a1420; transition: opacity .5s; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 34px; height: 34px; border-radius: 50%; margin-right: 12px;
      border: 3px solid rgba(255,255,255,.2); border-top-color: #4da3ff; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Three.js vendored locally (no CDN needed — works offline / on any static host) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="crosshair"></div>

  <div id="hud">
    <div><b>WASD</b> / Pfeiltasten — laufen &nbsp;·&nbsp; <b>Maus</b> — umschauen &nbsp;·&nbsp; <b>Shift</b> — rennen &nbsp;·&nbsp; <b>ESC</b> — Menü</div>
  </div>

  <div id="loading"><div class="spinner"></div><span>Anlage wird geladen …</span></div>

  <div id="overlay">
    <div class="card">
      <h1>🎾 3D Tennisclub</h1>
      <div class="sub">Ein Rundgang über die Anlage · 6 Sandplätze</div>
      <div class="keys">
        <div><span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span></div>
        <div class="d">Bewegen (auch Pfeiltasten)</div>
        <div><span class="k">Maus</span></div>
        <div class="d">Umschauen</div>
        <div><span class="k">Shift</span></div>
        <div class="d">Rennen</div>
        <div><span class="k">ESC</span></div>
        <div class="d">Zeiger freigeben / Menü</div>
      </div>
      <button id="play">Rundgang starten</button>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
